version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - bodyclose
    - gosec
  exclusions:
    rules:
      # Test fixtures marshal upstream api.User, which carries a Password field the tests never set.
      - path: '_test\.go'
        linters:
          - gosec
        text: 'G117:'

issues:
  max-same-issues: 3
